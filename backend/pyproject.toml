[project]
name = "monetary-policy-research-copilot"
version = "0.1.0"
description = "Research copilot for Canadian monetary policy: cited RAG, safe text-to-SQL and a tone index"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "pymupdf>=1.25",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
    "langgraph>=0.2",
    "litellm>=1.55",
    "duckdb>=1.1",
    "sqlglot>=25.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "pre-commit>=4.0"]

[project.scripts]
copilot = "copilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copilot"]

# CPU wheels for torch: the embedding model, reranker and FinBERT are small, and this keeps
# the install around 1 GB instead of 4 GB for CUDA builds.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = ["E501", "RUF001", "D203", "D213", "D100", "D104", "D107", "D401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs downloaded embedding/reranker models (skipped in CI)"]
